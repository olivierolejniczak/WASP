# WASP — Web Application Security Probe
# Configuration for llama3.2:3b on CPU-only Ollama (i5-9500T / DietPi)
# All values shown are the defaults — edit only what you need to change.

orchestrator:
  provider:       "ollama"
  model:          "llama3.2:3b"       # change to qwen3:1.7b for better judgment
  endpoint:       "http://localhost:11435"
  temperature:    0.1                 # low = more deterministic payloads
  max_tokens:     256                 # hard cap — prevents LLM rambling
  context_window: 8192

lite:
  wall_clock_budget_s: 840            # 14 minutes; use --budget N on CLI to override
  max_hypotheses:      6              # how many attack hypotheses to test
  tool_timeout_s:      45             # per-tool subprocess timeout
  recon_timeout_s:     90             # total recon phase timeout
  result_truncate_chars: 2048         # max chars fed back to LLM from tool output
  wordlist: "wasp/wordlist.txt"       # path to gobuster wordlist

tools:
  nmap:
    rate:     500                     # packets/sec — reduce on slow networks
  httpx:
    follow_redirects: true
    timeout:          10
    threads:          5
  gobuster:
    threads:  10
  sqlmap:
    level:      1                     # 1-5, keep low for speed
    risk:       1                     # 1-3, keep low for safety
    technique:  "B"                   # B=boolean, keep to avoid time-based (slow)
  nikto:
    max_time:   60                    # seconds
  nuclei:
    severity:   ["critical", "high"]
    rate_limit: 10                    # requests/sec

output:
  dir: "."                            # report written here as wasp-<timestamp>-<host>.md
