# WASP config — generated by deploy.sh
# Hardware: x86_64 | 6 cores | 15808 MB RAM | debian 13

orchestrator:
  provider:       "ollama"
  model:          "llama3.2:3b"
  endpoint:       "http://localhost:11435"
  temperature:    0.1
  max_tokens:     256
  context_window: 8192

lite:
  wall_clock_budget_s: 840
  max_hypotheses:      6
  tool_timeout_s:      45
  recon_timeout_s:     90
  result_truncate_chars: 2048
  wordlist: "/opt/wasp/wasp/wordlist.txt"

tools:
  nmap:
    rate: 1200
  httpx:
    follow_redirects: true
    timeout: 10
    threads: 12
  gobuster:
    threads: 12
  sqlmap:
    level: 1
    risk: 1
    technique: "B"
  nikto:
    max_time: 60
  nuclei:
    severity: ["critical", "high"]
    rate_limit: 30

output:
  dir: "."
